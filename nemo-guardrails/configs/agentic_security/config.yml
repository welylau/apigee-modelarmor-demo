models:
  - type: main
    engine: openai
    model: gemini-2.5-flash-lite
    parameters:
      base_url: "http://127.0.0.1:8081/v1"
      api_key: "vertex-adc"

rails:
  config:
    context_bloat_detection:
      max_chars: 4000
      min_chars: 50
      min_entropy: 3.0
      max_repetition_ratio: 0.4
      ngram_size: 3
      max_run_ratio: 0.15
      action: reject
    injection_detection:
      injections:
        - code
        - sqli
        - template
        - xss
      action: reject
  input:
    flows:
      - context bloat detection on input
  output:
    flows:
      - injection detection
