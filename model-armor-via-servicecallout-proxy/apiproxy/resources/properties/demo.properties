# Proxy-scoped property set "demo" (read as propertyset.demo.<key>).
# deploy.sh rewrites vertex_project, model and armor_* in a staged copy at deploy time.
vertex_host=aiplatform.googleapis.com
vertex_project=YOUR_PROJECT_ID
vertex_location=global
model=gemini-2.5-flash-lite
# Model Armor template: projects/<armor_project>/locations/<armor_location>/templates/<armor_template>
armor_project=YOUR_PROJECT_ID
armor_location=__ARMOR_LOCATION__
armor_template=apigee-model-armor-101
