# Proxy-scoped property set "demo" (read as propertyset.demo.<key>).
# scripts/setup-apigee.sh rewrites vertex_project, model and the armor_* values from
# PROJECT_ID / MODEL / ARMOR_PROJECT / ARMOR_LOCATION / ARMOR_TEMPLATE in a staged copy at
# deploy time; edit here for permanent changes.
vertex_host=aiplatform.googleapis.com
vertex_project=YOUR_PROJECT_ID
vertex_location=global
model=gemini-2.5-flash-lite
# Model Armor template: projects/<armor_project>/locations/<armor_location>/templates/<armor_template>
# armor_location is a placeholder: setup-apigee.sh sets armor_location from ARMOR_LOCATION at deploy time
# (and refuses to deploy if ARMOR_LOCATION is unset or the placeholder is left unresolved).
armor_project=YOUR_PROJECT_ID
armor_location=__ARMOR_LOCATION__
armor_template=apigee-model-armor-101
